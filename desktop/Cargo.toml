[package]
name = "kizuna-desktop"
version = "0.0.1"
edition = "2021"
description = "Kizuna daemon and CLI (Android <-> Linux link)"
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
mdns-sd = "0.21.5"
sha2 = "0.11.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls-pki-types = "1.15.1"
hex = "0.4.3"
iced = { version = "0.14.0", features = ["tokio", "image", "advanced", "svg"] }

[dev-dependencies]
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
